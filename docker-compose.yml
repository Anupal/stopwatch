services:
  gtfs_postgres:
    image: postgis/postgis:18-3.6
    command:
      - postgres
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - synchronous_commit=off
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - gtfs_postgres_data:/var/lib/postgresql/
      - ./db/gtfs_data:/gtfs_data
      - ./db/scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432  -U gtfs -d gtfs"]
      # 5 mins grace period after container init
      start_period: 5m
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
      - app_network
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      gtfs_postgres:
        condition: service_healthy
    
    networks:
      - app_network

networks:
  app_network:

volumes:
  gtfs_postgres_data: